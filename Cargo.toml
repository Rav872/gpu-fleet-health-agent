[package]
name = "gpu-fleet-health-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "A Kubernetes node agent for NVIDIA GPU health monitoring and safe remediation"
license = "UNLICENSED"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "test-util"] }
